name: CI - Test Course Generator

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Validate system_prompt.json
      run: |
        python -c "import json; data = json.load(open('system_prompt.json')); print(f'✅ JSON valid. Prompt length: {len(data.get(\"prompt\", \"\"))} chars')"
    
    - name: Check Python syntax
      run: |
        python -m py_compile generate_descriptions.py
        echo "✅ Python syntax is valid"
    
    - name: Check code style with flake8
      run: |
        pip install flake8
        flake8 generate_descriptions.py --count --select=E9,F63,F7,F82 --show-source --statistics
        echo "✅ No critical syntax errors found"
    
    - name: Test system prompt loading
      run: |
        python -c "import json; prompt = json.load(open('system_prompt.json'))['prompt']; assert isinstance(prompt, str); assert len(prompt) > 100; print(f'✅ System prompt loaded: {len(prompt)} characters')"
    
    - name: Test JSON validation
      run: |
        python -c "import json; data = json.loads('{\"test\": \"data\"}'); assert data == {'test': 'data'}; print('✅ JSON validation works')"
    
    - name: Check for common issues
      run: |
        echo "Checking for hardcoded credentials..."
        if grep -E "password\s*=\s*['\"][^'\"]+['\"]" --include="*.py" -r . 2>/dev/null | grep -v "DB_PASSWORD"; then
          echo "⚠️ Warning: Possible hardcoded password found"
          exit 1
        fi
        if grep -E "sk-proj-[a-zA-Z0-9_-]{48,}" --include="*.py" -r . 2>/dev/null; then
          echo "⚠️ Warning: Possible OpenAI API key in code"
          exit 1
        fi
        echo "✅ No hardcoded credentials detected"
    
    - name: Summary
      run: |
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "✅ All CI checks passed!"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "✓ Dependencies installed"
        echo "✓ JSON files validated"
        echo "✓ Python syntax correct"
        echo "✓ Code style checked"
        echo "✓ Imports working"
        echo "✓ Functions tested"
        echo "✓ No security issues"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
