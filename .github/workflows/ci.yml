name: CI - Test Course Generator

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Validate system_prompt.json
      run: |
        python -c "import json; data = json.load(open('system_prompt.json')); print(f'✅ JSON valid. Prompt length: {len(data.get(\"prompt\", \"\"))} chars')"
    
    - name: Check Python syntax
      run: |
        python -m py_compile generate_descriptions.py
        echo "✅ Python syntax is valid"
    
    - name: Check code style with flake8
      run: |
        pip install flake8
        flake8 generate_descriptions.py --count --select=E9,F63,F7,F82 --show-source --statistics
        echo "✅ No critical syntax errors found"
    
    - name: Verify imports
      run: |
        python -c "import sys; sys.path.insert(0, '.'); from generate_descriptions import load_system_prompt, validate_json; print('✅ All imports successful')"
    
    - name: Test system prompt loading
      run: |
        python -c "from generate_descriptions import load_system_prompt; prompt = load_system_prompt(); assert isinstance(prompt, str); assert len(prompt) > 100; print(f'✅ System prompt loaded: {len(prompt)} characters')"
    
    - name: Test JSON validation function
      run: |
        python -c "from generate_descriptions import validate_json; result = validate_json('{\"test\": \"data\"}'); assert result == {'test': 'data'}; print('✅ JSON validation works')"
    
    - name: Check for common issues
      run: |
        echo "Checking for hardcoded credentials..."
        if grep -r "password\s*=\s*['\"]" --include="*.py" .; then
          echo "⚠️ Warning: Possible hardcoded password found"
          exit 1
        fi
        if grep -r "sk-[a-zA-Z0-9]" --include="*.py" .; then
          echo "⚠️ Warning: Possible API key in code"
          exit 1
        fi
        echo "✅ No hardcoded credentials detected"
    
    - name: Summary
      run: |
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "✅ All CI checks passed!"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "✓ Dependencies installed"
        echo "✓ JSON files validated"
        echo "✓ Python syntax correct"
        echo "✓ Code style checked"
        echo "✓ Imports working"
        echo "✓ Functions tested"
        echo "✓ No security issues"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
